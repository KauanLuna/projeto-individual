<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BatSite | ❔</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/jogo.css">
    <link rel="icon" href="./assets/imgs/logoBatSite.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>
    <div class="carregamento" id="carregamento"><img src="./assets/imgs/charadaIMG.gif" alt="Logo carregando"></div>
    <div class="conteudoPrincipal" id="conteudoPrincipal">

        <!--header inicio-->
        <div class="header">
            <div class="container">
                <div class="logo"><img src="./assets/imgs/logoBatSite.png"></div>
                <ul class="navbar">
                    <li>
                        <a href="./index.html">Inicial</a>
                    </li>
                    <li class="agora"><span class="interrogacao">?</span></li>
                    <li>|</li>
                    <li>
                        <a href="./login.html">Login</a>
                    </li>
                    <li>
                        <a href="./cadastro.html">Cadastro</a>
                    </li>
                </ul>
            </div>
        </div>
        <!--header fim-->
        <div class="jogo">
            <div class="container">
                <div class="titulo">
                    <h1>Quem é o Vilão?</h1>
                </div>
                <div class="pista_box">
                    <p id="pista" class="pista">Clique no botão para a primeira pista.</p>
                    <button onclick="mostrarProximaPista()">Mostrar Pista</button>
                </div>
                <div id="suspeitos" class="suspeitos">
                    <div class="titulo">
                        <h2>Quem é o culpado?</h2>
                    </div>
                    <div class="botoes">
                        <button onclick="verificarResposta('charada')">Charada</button>
                        <button onclick="verificarResposta('pinguim')">Pinguim</button>
                        <button onclick="verificarResposta('falcone')">Carmine Falcone</button>
                    </div>
                </div>
                <p class="resultado" id="resultado"></p>
            </div>
        </div>
        <div class="footer">
            <div class="container">
                <h4>Feito com amor por aluno &hearts; SPTech &copy; 2023</h4>
                <span class="version">v1.0.0</span>
            </div>
        </div>
    </div>
</body>

</html>
<script>

    // Função para ocultar o carregamento e mostrar o conteúdo principal
    function carregamentoInicial() {
        const carregamento = document.getElementById('carregamento');
        const conteudoPrincipal = document.getElementById('conteudoPrincipal');

        conteudoPrincipal.style.display = 'block';

        carregamento.classList.add('sumir');

        setTimeout(() => {
            carregamento.style.display = 'none';
            conteudoPrincipal.classList.add('aparecer');
        }, 1000); // 1 segundos de atraso
    }

    // Chama a função após um pequeno atraso (2 segundos)
    setTimeout(carregamentoInicial, 1500);

    const casos = [
        {
            vilao: "charada",
            pistas: [
                "Ele costuma deixar enigmas como mensagens.",
                "Foi visto usando uma máscara estranha.",
                "Se comunica com vídeos enigmáticos."
            ]
        },
        {
            vilao: "pinguim",
            pistas: [
                "Tem conexões com o submundo de Gotham, especialmente com bares noturnos.",
                "É manco e costuma andar com passos pesados e claudicantes.",
                "Gosta de usar apelidos sarcásticos e sempre parece saber mais do que diz."
            ]
        },
        {
            vilao: "carmine falcone",
            pistas: [
                "Envolvido em esquemas políticos e policiais há décadas.",
                "Raramente é visto em público — mas sua influência está por toda parte.",
                "Foi mencionado em um dossiê sobre corrupção na prefeitura."
            ]
        }
    ]

    // Sorteia um caso aleatório ao carregar a página
    const casoAtual = casos[Math.floor(Math.random() * casos.length)];
    let indiceAtual = 0;

    // Função para mostrar a próxima pista
    function mostrarProximaPista() {
        const pistaEl = document.getElementById("pista");
        if (indiceAtual < casoAtual.pistas.length) {
            pistaEl.textContent = casoAtual.pistas[indiceAtual];
            indiceAtual++;
            if (indiceAtual === casoAtual.pistas.length) {
                document.getElementById("suspeitos").style.display = "flex";
            }
        } else {
            pistaEl.textContent = "Todas as pistas foram reveladas.";
        }
    }

    // Função para verificar se o jogador acertou
    function verificarResposta(suspeito) {
        const resultado = document.getElementById("resultado");
        if (suspeito === casoAtual.vilao) {
            resultado.textContent = "✅ Acertou! Você descobriu o verdadeiro vilão.";
        } else {
            resultado.textContent = `❌ Errou... O verdadeiro vilão era ${casoAtual.vilao}.`;
        }
    }

</script>
