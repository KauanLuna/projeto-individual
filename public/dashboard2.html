<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batsite | Painel de controle</title>
    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="./css/dashboards.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="icon" href="./assets/imgs/logoBatSite.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/dashboard.js"></script>
</head>

<body
    onload="carregamentoInicial(), obterTotalUsuarios(), obterTotalFavoritos(), obterPorcentagemTipos(), obterTotalFavoritosTotais(), obterNomeMaisFavoritado()">
    <div class="carregamento" id="carregamento"><img src="./assets/imgs/logoBatman.gif" alt="Logo carregando"></div>
    <div class="conteudoPrincipal" id="conteudoPrincipal">

        <div class="menu_lateral">
            <img class="logo" src="./assets/imgs/logoBatSite.png" alt="Logo do site">
            <ul class="menu">
                <li>
                    <a>Bem vindo, BatAdministrador!</a>
                </li>
                <li>
                    <a href="index.html">Página Inicial</a>
                </li>
                <li>
                    <a href="fichas.html">Fichas</a>
                </li>
                <li>
                    <a href="seusFavoritos.html">Seus Favoritos</a>
                </li>
                <li>
                    <img src="./assets/imgs/logoutICON.png" alt="Ícone de logout" class="icon_logout" id="icon_logout"
                        onclick="logout()">
                </li>
            </ul>
        </div>

        <div class="painel">
            <div class="KPIS">
                <div class="kpi_total_favoritos">
                    <h2>Total de Favoritos</h2>
                    <p id="totalFavoritos"></p>
                </div>
                <div class="kpi_nome_favoritado">
                    <h2>Personagem mais Favoritado</h2>
                    <p id="nomeFavoritado"></p>
                </div>
                <div class="kpi_total_usuarios">
                    <h2>Total de Usuários</h2>
                    <p id="totalUsuarios"></p>
                </div>
            </div>
            <div class="graficos">
                <div class="grafico_total_favoritos">
                    <canvas id="TotalFavoritos" class="grafico"></canvas>
                </div>
                <div class="grafico_total_tipos">
                    <canvas id="TotalTipos" class="grafico"></canvas>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
