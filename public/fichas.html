<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BatSite | Vilões</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/fichas.css">
    <link rel="stylesheet" href="./css/pontas.css">
    <link rel="icon" href="./assets/imgs/logoBatSite.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body onload="listar()">
    <div class="carregamento" id="carregamento"><img src="./assets/imgs/logoBatman.gif" alt="Logo carregando"></div>
    <div class="conteudoPrincipal" id="conteudoPrincipal">

        <!--header inicio-->
        <div class="header">
            <div class="container">
                <div class="logo"><img src="./assets/imgs/logoBatSite.png"></div>
                <ul class="navbar">
                    <li>
                        <a href="./index.html">Inicial</a>
                    </li>
                    <li class="a_fichas agora">
                        <a id="a_fichas" href="#">Fichas</a>
                    </li>
                    <li>
                        <a href="seusFavoritos.html">Seus Favoritos</a>
                    </li>
                    <li>|</li>
                    <span class="cadastro" id="cadastro">
                        <li>
                            <a href="login.html">Login</a>
                        </li>
                        <li>
                            <a href="cadastro.html">Cadastro</a>
                        </li>
                    </span>
                    <span id="icon_logout" class="icon_logout" onclick="logout()"><img src="./assets/imgs/logoutICON.png"></span>
                </ul>
            </div>
        </div>
        <!--header fim-->

        <h1 class="titulo">Fichas dos personagens principais</h1>

        <div class="conjunto_fichas" id="conjunto_fichas">
        </div>

        <div class="footer">
            <div class="container">
                <div class="git_sobre_mim"><a href="https://github.com/KauanLuna/projeto-individual"><img src="./assets/imgs/logoGITHUB.png"></a> <span class="bat_criador"><a href="sobremim.html" class="footer_sobremim">Conheça o BatCriador!</a></span></div>
            </div>
        </div>
    </div>
</body>

</html>
<script>

    // Função para ocultar o carregamento e mostrar o conteúdo principal
    function carregamentoInicial() {
        const carregamento = document.getElementById('carregamento');
        const conteudoPrincipal = document.getElementById('conteudoPrincipal');

        conteudoPrincipal.style.display = 'block';

        carregamento.classList.add('sumir');

        setTimeout(() => {
            carregamento.style.display = 'none';
            conteudoPrincipal.classList.add('aparecer');
        }, 1000); // 1 segundos de atraso
    }

    // Chama a função após um pequeno atraso (2 segundos)
    setTimeout(carregamentoInicial, 1500);

    function listar() {

        fetch("/personagens/listar").then(res => {
            if (res.ok) {
                res.json().then(personagens => {
                    const conjunto = document.getElementById("conjunto_fichas");
                    personagens.forEach(personagem => {
                        const card = document.createElement("div");
                        card.className = "card-personagem";

                        card.innerHTML = `
                        <div class="icone_personagens">
                        <img src="../assets/imgs/${personagem.foto}" alt="${personagem.nome}">
                        </div>
                        <h2>${personagem.apelido}</h2>
                        <p><strong>Nome: </strong>${personagem.nome}</p>
                        <p><strong>Modus Operandi: </strong>${personagem.modus_operandi}</p>
                        <p><strong>Local de Atuação: </strong>${personagem.local_atuacao}</p>
                        <p><strong>Frase: </strong>${personagem.frase}</p>
                        <button onclick="favoritar(${personagem.id})">⭐ Favoritar</button>
                    `;

                        conjunto.appendChild(card);
                    });
                });
            }
        });
    }

    function favoritar(fk_personagem, fk_usuario) {

        var fk_usuario = Number(sessionStorage.getItem("ID_USUARIO"));

        fetch("/personagens/favoritar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                fk_usuario: fk_usuario,
                fk_personagem: fk_personagem
            })
        }).then(res => {
            if (res.ok) {
                alert("Personagem favoritado com sucesso!");
            } else {
                alert("Você já favoritou esse personagem!");
            } 
        });
    }

    const cadastro = document.getElementById("cadastro");

    const aFichas = document.getElementById("a_fichas");

    const iconLogout = document.getElementById("icon_logout");

    function logout() {
        sessionStorage.clear();
        window.location = "index.html";
    }

    aFichas.style.display = "none";
    cadastro.style.display = "flex";
    iconLogout.style.display = "none";

    if (sessionStorage.getItem("NOME_USUARIO") != null) {
        cadastro.innerHTML = `<li><a href="perfil.html">Olá, ${sessionStorage.getItem("NOME_USUARIO")}</a></li>`;
        cadastro.style.justifyContent = "center";
        aFichas.style.display = "block";
        iconLogout.style.display = "flex";
    }



</script>
