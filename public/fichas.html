<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BatSite | Vilões</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/fichas.css">
    <link rel="icon" href="./assets/imgs/logoBatSite.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body onload="listar()">
    <div class="carregamento" id="carregamento"><img src="./assets/imgs/charadaIMG.gif" alt="Logo carregando"></div>
    <div class="conteudoPrincipal" id="conteudoPrincipal">

        <!--header inicio-->
        <div class="header">
            <div class="container">
                <div class="logo"><img src="./assets/imgs/logoBatSite.png"></div>
                <ul class="navbar">
                    <li>
                        <a href="./index.html">Inicial</a>
                    </li>
                    <li class="agora"><span class="interrogacao">Fichas</span></li>
                    <li>|</li>
                    <li>
                        <a href="./login.html">Login</a>
                    </li>
                    <li>
                        <a href="./cadastro.html">Cadastro</a>
                    </li>
                </ul>
            </div>
        </div>
        <!--header fim-->

        <div class="conjunto_fichas" id="conjunto_fichas">

            <h1>Fichas Criminais dos Vilões</h1>
        </div>
</body>

</html>
<script>

    var idUsuario = sessionStorage.getItem("ID_USUARIO");
    if (idUsuario == null) {
        alert("Você precisa estar logado para acessar esta página.");
        window.location.href = "./login.html";
    }

    // Função para ocultar o carregamento e mostrar o conteúdo principal
    function carregamentoInicial() {
        const carregamento = document.getElementById('carregamento');
        const conteudoPrincipal = document.getElementById('conteudoPrincipal');

        conteudoPrincipal.style.display = 'block';

        carregamento.classList.add('sumir');

        setTimeout(() => {
            carregamento.style.display = 'none';
            conteudoPrincipal.classList.add('aparecer');
        }, 1000); // 1 segundos de atraso
    }

    // Chama a função após um pequeno atraso (2 segundos)
    setTimeout(carregamentoInicial, 1500);

    function listar() {

        fetch("/viloes/listar").then(res => {
            if (res.ok) {
                res.json().then(viloes => {
                    const conjunto = document.getElementById("conjunto_fichas");
                    viloes.forEach(vilao => {
                        const card = document.createElement("div");
                        card.className = "card-vilao";

                        card.innerHTML = `
                        <div class="icone_viloes">
                        <img src="../assets/imgs/${vilao.foto}" alt="${vilao.nome}">
                        </div>
                        <h2>${vilao.apelido}</h2>
                        <p><strong>Nome: </strong>${vilao.nome}</p>
                        <p><strong>Modus Operandi: </strong>${vilao.modus_operandi}</p>
                        <p><strong>Local de Atuação: </strong>${vilao.local_atuacao}</p>
                        <p><strong>Frase: </strong>${vilao.frase}</p>
                        <button onclick="favoritarVilao(${vilao.id})">⭐ Favoritar</button>
                    `;

                        conjunto.appendChild(card);
                    });
                });
            }
        });
    }

    function favoritar() {

        var fk_usuario = sessionStorage.getItem("ID_USUARIO");
        var fk_vilao = vilao.

            fetch("/viloes/favoritar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    fk_usuario: fk_usuario,
                    fk_vilao: fk_vilao
                })
            }).then(res => {
                if (res.ok) {
                    alert("Vilão favoritado com sucesso!");
                } else {
                    alert("Erro ao favoritar vilão.");
                }
            }).catch(err => {
                console.error("Erro ao favoritar vilão:", err);
                alert("Erro ao favoritar vilão.");
            });
    }

</script>
