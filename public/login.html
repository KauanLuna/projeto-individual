<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BatSite | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/pontas.css">
    <link rel="icon" href="./assets/imgs/logoBatSite.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>
    <div class="carregamento" id="carregamento"><img src="./assets/imgs/logoBatman.gif" alt="Logo carregando"></div>
    <div class="conteudoPrincipal" id="conteudoPrincipal">

        <!--Header-->
        <div class="header">
            <div class="container">
                <div class="logo"><img src="./assets/imgs/logoBatSite.png"></div>
                <ul class="navbar">
                    <li>
                        <a href="index.html">Inicial</a>
                    </li>
                    <li class="a_fichas">
                        <a id="a_fichas" href="fichas.html">Fichas</a>
                    </li>
                    <li>|</li>
                    <span class="cadastro" id="cadastro">
                        <li class="agora">
                            <a href="#">Login</a>
                        </li>
                        <li>
                            <a href="cadastro.html">Cadastro</a>
                        </li>
                    </span>
                    <span id="icon_logout" class="icon_logout"><img src="./assets/imgs/logoutICON.png"></span>
                </ul>
            </div>
        </div>


        <div class="login">
            <div class="container">
                <div class="card card-login">
                    <div class="titulo_formulario">
                        <h2>BatLogin</h2>
                    </div>
                    <div class="formulario">
                        <div class="campo">
                            <span id="email">Email:</span>
                            <input id="email_input" type="text" placeholder="Digite o seu nome de usuário">
                        </div>
                        <div class="campo">
                            <span id="senha">Senha:</span>
                            <input id="senha_input" type="password" placeholder="******">
                            <img onclick="mostrarOcultarSenha()" src="./assets/imgs/olhoMostrar.png" id="MostrarOcultar"
                                class="MostrarOcultar" alt="Icone para mostrar ou ocultar senha">
                        </div>
                        <button class="botao" onclick="entrar()">Entrar</button>
                    </div>
                </div>
            </div>
            <div class="img_lateral">
                <img src="./assets/imgs/loginIMG.jpg" alt="Imagem do batman">
            </div>
        </div>

        <!--footer inicio-->
        <div class="footer">
            <div class="container">
                <div class="git_sobre_mim"><a href="https://github.com/KauanLuna/projeto-individual"><img
                            src="./assets/imgs/logoGITHUB.png"></a> <span class="bat_criador"><a href="sobremim.html"
                            class="footer_sobremim">Conheça o BatCriador!</a></span></div>
            </div>
        </div>
        <!--footer fim-->
    </div>
</body>

</html>

<script>
    //Função destinada a exibir a senha ou ocultar ela, conforme o usuário clica no botão ao lado da input
    function mostrarOcultarSenha() {
        const campoSenha = document.getElementById("senha_input"); //Guarda o id do campo senha
        const olho = document.getElementById("MostrarOcultar"); //Guarda o id do olho ao lado da senha

        // Condicional para alterar a visualização e alterar tambem o botão ao lado do campo
        if (campoSenha.type == "password") {
            campoSenha.type = "text";
            olho.src = "./assets/imgs/olhoOcultar.png";
        } else if (campoSenha.type == "text") {
            campoSenha.type = "password";
            olho.src = "./assets/imgs/olhoMostrar.png";
        }
    }

    // Função responsável por ocultar a tela de carregamento e exibir o conteúdo da página logo após
    function carregamentoInicial() {
        const carregamento = document.getElementById('carregamento');
        const conteudoPrincipal = document.getElementById('conteudoPrincipal');

        conteudoPrincipal.style.display = 'block'; // Transforma o display da div que guarda o conteúdo da página em block, porem ainda com a opacidade 0

        carregamento.classList.add('sumir'); // Adiciona class responsável por fazer uma transição suave de opacidade, fazendo com que a tela de carregamento suma

        setTimeout(() => {
            carregamento.style.display = 'none';
            conteudoPrincipal.classList.add('aparecer'); // Adiciona class responsável por fazer uma transição suave de opacidade na div que possui o conteúdo da página
        }, 1000); // setTimeout responsável por desativar a tela de carregamento e fazer com que o conteúdo da página receba a class "aparecer"
    }

    // Chama a função responsável por ocultat a tela de carregamento e exibir o conteúdo da página
    setTimeout(carregamentoInicial, 1500);

    function entrar() {


        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";

            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.SENHA_USUARIO = json.senha;
                    console.log("EMAIL_USUARIO: " + sessionStorage.EMAIL_USUARIO);
                    console.log("ID_USUARIO: " + sessionStorage.ID_USUARIO);

                    if (json.email == "k@.com" && json.senha == "admin") {
                        var admin = true;
                        sessionStorage.ADMIN = admin;
                    } else {
                        var admin = false;
                        sessionStorage.ADMIN = admin;
                    }


                    setTimeout(function () {

                        if (admin) {
                            console.log("O usuário é um administrador!");
                            window.location = "./dashboard2.html";
                        } else {
                            console.log("O usuário não é um administrador!");
                            window.location = "./index.html";
                        }

                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

    const cadastro = document.getElementById("cadastro");

    const aFichas = document.getElementById("a_fichas");

    aFichas.style.display = "none";
    cadastro.style.display = "flex";
    iconLogout.style.display = "none";

    if (sessionStorage.getItem("NOME_USUARIO") != null) {
        cadastro.innerHTML = `<li><a href="perfil.html">Olá, ${sessionStorage.getItem("NOME_USUARIO")}</a></li>`;
        cadastro.style.justifyContent = "center";
        aFichas.style.display = "block";
    }


</script>
