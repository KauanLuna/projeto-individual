<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BatSite | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/cadastro.css" />
  <link rel="stylesheet" href="./css/pontas.css">
  <link rel="icon" href="./assets/icon/logo.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
  <div class="carregamento" id="carregamento"><img src="./assets/imgs/logoBatman.gif" alt="Logo carregando"></div>
  <div class="conteudoPrincipal" id="conteudoPrincipal">

    <!-- Div Modal para informar o usuário -->
    <div class="modal" id="modal">
      <div class="card_modal" id="card_modal">
        <img id="imagem_resposta" class="imagem_resposta" alt="Imagem de retorno para o usuário">
        <p class="info_usuário" id="info_usuario"></p>
      </div>
    </div>

    <!--header inicio-->
    <div class="header">
      <div class="container">
        <div class="logo"><img src="./assets/imgs/logoBatSite.png"></div>
        <ul class="navbar">
          <li>
            <a href="index.html">Inicial</a>
          </li>
          <li class="a_fichas">
            <a id="a_fichas" href="fichas.html">Fichas</a>
          </li>
          <li>|</li>
          <span class="cadastro" id="cadastro">
            <li>
              <a href="login.html">Login</a>
            </li>
            <li class="agora">
              <a href="#">Cadastro</a>
            </li>
          </span>
        </ul>
      </div>
    </div>
    <!--header fim-->

    <div class="cadastro">
      <div class="container">
        <div class="card card-cadastro">
          <h2>BatCadastro</h2>
          <div class="formulario">
            <div class="campo">
              <!--Campo para inserir o nome-->
              <span>Nome:</span>
              <input id="nome_input" type="text" placeholder="Seu nome" required />
            </div>
            <!-- campo para inserir o email -->
            <div class="campo">
              <span>Email:</span>
              <input id="email_input" type="email" placeholder="Digite seu email" required />
            </div>
            <!-- campo para inserir a senha -->
            <div class="campo">
              <span>Senha:</span>
              <input id="senha_input" type="password" placeholder="Digite a sua senha" required />
              <img onclick="mostrarOcultar_Senha()" src="./assets/imgs/olhoMostrar.png" id="MostrarOcultar1"
                class="MostrarOcultar" alt="Icone para mostrar ou ocultar senha">
            </div>
            <!-- campo para inserir a confirmação da senha -->
            <div class="campo">
              <span>Confirmação da Senha:</span>
              <input id="confirmacao_senha_input" type="password" placeholder="Digite a senha novamente" required />
              <img onclick="mostrarOcultar_ConfirmarSenha()" src="./assets/imgs/olhoMostrar.png" id="MostrarOcultar2"
                class="MostrarOcultar" alt="Icone para mostrar ou ocultar senha">
            </div>
            <button class="botao" onclick="cadastrar()">Cadastrar</button>
          </div>
        </div>

      </div>
      <div class="img_lateral">
        <img src="./assets/imgs/loginIMG.jpg" alt="Imagem do batman">
      </div>
    </div>

    <!--footer inicio-->
    <div class="footer">
      <div class="container">
        <div class="git_sobre_mim"><a href="https://github.com/KauanLuna/projeto-individual"><img
              src="./assets/imgs/logoGITHUB.png"></a> <span class="bat_criador"><a href="sobremim.html"
              class="footer_sobremim">Conheça o BatCriador!</a></span></div>
      </div>
    </div>
    <!--footer fim-->
  </div>
</body>

</html>

<script>

  if (sessionStorage.ID_USUARIO != undefined){
    alert('Você não pode acessar essa página já logado!')

    window.location = "index.html";
  }

  // Função para ocultar o carregamento e mostrar o conteúdo principal
  function carregamentoInicial() {
    const carregamento = document.getElementById('carregamento');
    const conteudoPrincipal = document.getElementById('conteudoPrincipal');

    conteudoPrincipal.style.display = 'block';

    carregamento.classList.add('sumir');

    setTimeout(() => {
      carregamento.style.display = 'none';
      conteudoPrincipal.classList.add('aparecer');
    }, 1000); // 1 segundos de atraso
  }

  // Chama a função responsável por realizar o carregamento da página, após um pequeno atraso (1.5 segundos)
  setTimeout(carregamentoInicial, 1500);

  function mostrarOcultar_Senha() {
        const campoSenha = document.getElementById("senha_input"); //Guarda o id do campo senha
        const campoConfirmarSenha = document.getElementById("confirmacao_senha_input");
        const olho = document.getElementById("MostrarOcultar1"); //Guarda o id do olho ao lado da senha
        const olho2 = document.getElementById("MostrarOcultar2");

        // Condicional para alterar a visualização e alterar tambem o botão ao lado do campo
        if (campoSenha.type == "password") {
            campoSenha.type = "text";
            olho.src = "./assets/imgs/olhoOcultar.png";
        } else if (campoSenha.type == "text") {
            campoSenha.type = "password";
            olho.src = "./assets/imgs/olhoMostrar.png";
        }
    }

    function mostrarOcultar_ConfirmarSenha() {
        const campoConfirmarSenha = document.getElementById("confirmacao_senha_input");
        const olho = document.getElementById("MostrarOcultar2");

        // Condicional para alterar a visualização e alterar tambem o botão ao lado do campo
        if (campoConfirmarSenha.type == "password") {
            campoConfirmarSenha.type = "text";
            olho.src = "./assets/imgs/olhoOcultar.png";
        } else if (campoConfirmarSenha.type == "text") {
            campoConfirmarSenha.type = "password";
            olho.src = "./assets/imgs/olhoMostrar.png";
        }
    }

  function cadastrar() {

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" || senhaVar == "" || emailVar == "" || confirmacaoSenhaVar == ""
    ) {
      let mensagem = "Preencha todos os campos, para realizar o cadastro"

      let respostaModal = false;
      exibirModal(respostaModal, mensagem);

      return false;

    } else if (
      nomeVar.length < 1 ||
      emailVar.includes("@") == false ||
      emailVar.includes(".com") == false ||
      senhaVar.length < 6 ||
      confirmacaoSenhaVar != senhaVar
    ) {

      let mensagem;

      if (nomeVar.length < 1) {
        mensagem = "O nome deve conter no minímo duas letras";
      } else if (senhaVar.length < 6) {
        mensagem = "A senha deve conter no minímo 7 letras";
      } else if (confirmacaoSenhaVar != senhaVar) {
        mensagem = "As senhas não coincidem"
      } else {
        mensagem = "Email inválido";
      }

      let respostaModal = false;

      exibirModal(respostaModal, mensagem);

      return false;
    }

    function exibirModal(respostaModal, mensagem) {
      const modal = document.getElementById("modal");
      const cardModal = document.getElementById("card_modal")
      const infoUsuario = document.getElementById("info_usuario");
      const imagemResposta = document.getElementById("imagem_resposta");


      if (respostaModal == true) {
        imagemResposta.src = "./assets/imgs/imgCerto.png"
      } else {
        imagemResposta.src = "./assets/imgs/imgErro.png"
      }

      infoUsuario.innerHTML = mensagem;
      modal.style.display = "flex";

      setTimeout(ocultarModal, 3000)

    }

    function ocultarModal() {
      const modal = document.getElementById("modal");

      modal.style.display = "none";
    }


    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {

          let mensagem = "Cadastro realizado com sucesso"
          let respostaModal = true;

          exibirModal(respostaModal, mensagem);

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    return false;
  }

  const cadastro = document.getElementById("cadastro");

  const aFichas = document.getElementById("a_fichas");


  aFichas.style.display = "none";
  cadastro.style.display = "flex";

  if (sessionStorage.getItem("NOME_USUARIO") != null) {
    cadastro.innerHTML = `<li><a href="perfil.html">Olá, ${sessionStorage.getItem("NOME_USUARIO")}</a></li>`;
    cadastro.style.justifyContent = "center";
    aFichas.style.display = "block";
  }

</script>
